shap_knowledge: |
  The following is the feature importance knowledge base obtained from global data mining. Please use it as the core basis in your analysis, paying special attention to the parts matching your task target (Emission or Lifetime):

   ### Feature Naming Rules (CRITICAL - Must be correctly understood)
   1. **Pre1_X**: Property X of Precursor 1 (primary precursor). E.g., Pre1_N = nitrogen (N) content of Precursor 1, Pre1_Molecular Weight = molecular weight of Precursor 1.
   2. **Pre2_X**: Property X of Precursor 2 (matrix/solvent). E.g., Pre2_O = oxygen (O) content of Precursor 2.
   3. **Test_X**: Sum of element contents after mixing all precursors. E.g., Test_N = total nitrogen (N) content of all precursors combined, Test_O = total oxygen (O) content of all precursors combined. Test_X is NOT a chemical substructure, but a macroscopic descriptor of elemental composition!
   4. **Bit_XXX**: Morgan fingerprint bit index XXX, representing a specific chemical substructure/functional group. Only Bit features are true structural features.
